[project]
name = "aria-subtitles"
version = "2.0.1"
description = "ARIA - AI Realtime Intelligent Audio | Universal Real-time AI Subtitles"
license = { text = "GPL-3.0" }
requires-python = ">=3.10"
authors = [
    { name = "sayksii", email = "mark42967151@gmail.com" }
]
keywords = ["subtitle", "speech-recognition", "real-time", "accessibility", "transcription"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.24.0",
    "PyAudioWPatch>=0.2.12.6",
    "PyQt6>=6.5.0",
    "pystray>=0.19.0",
    "pillow>=10.0.0",
    "sherpa-onnx>=1.10.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "huggingface_hub>=0.20.0",
    # LiveCaptions mode dependencies
    "pywin32>=306",
    "uiautomation>=2.0.0",
    "comtypes>=1.2.0",
    "pyautogui>=0.9.53",
    "translators>=6.0.4",
    "modelscope>=1.39.1",
]

[project.urls]
Homepage = "https://github.com/FTWsGit/Aria"
Repository = "https://github.com/FTWsGit/Aria"
Issues = "https://github.com/FTWsGit/Aria/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
aria = "aria.ui:run_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aria"]

[tool.ruff]
target-version = "py311"
line-length = 120 

include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import 排序)
    "N",   # pep8-naming (命名规范)
    "UP",  # pyupgrade (过时语法升级)
    "B",   # flake8-bugbear (常见 bug)
    "C4",  # flake8-comprehensions (推导式优化)
    "SIM", # flake8-simplify (简化建议)
]
ignore = [
    "E501",   # 行太长 — GUI 里 tkinter 布局代码经常超长
    "N802",   # 函数名小写 — tkinter callback 有时用驼峰
    "N803",   # 参数名小写
    "N806",   # 局部变量大写 — 常量放函数里时常见
]

[tool.ruff.lint.per-file-ignores]
"src/aria/i18n/*.py" = ["N999"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
